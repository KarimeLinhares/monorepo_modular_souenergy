name: CI - Backend Tests & Frontend Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Laravel API Tests (PHPUnit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, zip, bcmath, intl
          coverage: none

      - name: Instalar dependências do Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar arquivo .env de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executar testes automatizados
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --testdox

  frontend-build:
    name: Vue.js Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        run: npm ci

      - name: Validar build de produção (Vite)
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build
